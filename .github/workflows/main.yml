name: Build Lantern Windows 3D Setup

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Windows Runner & Compile Release
        shell: powershell
        run: |
          if (Test-Path "lib/.github") { Remove-Item -Recurse -Force "lib/.github" }
          if (Test-Path "lib/build.yml") { Remove-Item -Force "lib/build.yml" }
          Copy-Item pubspec.yaml pubspec.yaml.bak
          Copy-Item lib/main.dart main.dart.bak
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name lantern_windows .
          Move-Item -Force pubspec.yaml.bak pubspec.yaml
          Move-Item -Force main.dart.bak lib/main.dart
          flutter pub get
          flutter build windows --release --no-tree-shake-icons

      - name: Download & Bundle Official Xray-Core Engine
        shell: powershell
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip" -OutFile "xray.zip"
          Expand-Archive -Path "xray.zip" -DestinationPath "$releaseDir" -Force

      - name: Compile Windows Setup Installer (Lantern-3D-Setup.exe)
        shell: powershell
        run: |
          $issContent = @"
          [Setup]
          AppId={{8A93F2D4-5B7E-4C91-9E2A-7F8D3C6B1A20}
          AppName=Lantern 3D Spatial VPN
          AppVersion=10.5.0
          AppPublisher=Lantern Spatial Cloud
          DefaultDirName={autopf}\Lantern3DVPN
          DefaultGroupName=Lantern 3D VPN
          DisableProgramGroupPage=yes
          PrivilegesRequired=lowest
          OutputDir=installer_out
          OutputBaseFilename=Lantern-3D-Setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Lantern 3D Spatial VPN"; Filename: "{app}\lantern_windows.exe"
          Name: "{autodesktop}\Lantern 3D Spatial VPN"; Filename: "{app}\lantern_windows.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\lantern_windows.exe"; Description: "{cm:LaunchProgram,Lantern 3D Spatial VPN}"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content -Path "setup.iss" -Value $issContent -Encoding UTF8
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "setup.iss"

      - name: Upload Windows Setup Installer (.EXE)
        uses: actions/upload-artifact@v4
        with:
          name: Lantern-Windows-3D-Setup-Installer
          path: installer_out/Lantern-3D-Setup.exe
